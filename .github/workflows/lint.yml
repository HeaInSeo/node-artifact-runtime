name: Lint

# No paths-ignore: the workflow always triggers so the required check "Run on
# Ubuntu" always reports a status. Docs-only changes are detected in-job and the
# work is skipped (green) — see .github/actions/detect-docs-only. (#29)
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: ./.github/actions/detect-docs-only

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run lint guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint
